syntax = "proto3";

package orm;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/wxdqing/protoc-gen-go-orm/options";

enum TableStoreMode {
  TABLE_STORE_MODE_PAYLOAD = 0; // pk/index/version + data payload
  TABLE_STORE_MODE_FIELDS = 1;  // field expansion: simple columns, complex JSON
}

extend google.protobuf.MessageOptions
{
  string tcaplus_primary_key             = 847900; //Tcaplus Primary Key
  repeated string tcaplus_index                   = 847901; //Tcaplus Index
  string tcaplus_field_cipher_suite      = 847902; //Tcaplus field crypto suite name
  string tcaplus_record_cipher_suite     = 847903; //Tcaplus record crypto suite name
  string tcaplus_cipher_md5              = 847904; //Tcaplus crypto key md5
  string tcaplus_sharding_key            = 847905; //Tcaplus sharding key
  string tcaplus_customattr              = 847906; //Tcaplus custom define attribute
}

extend google.protobuf.FieldOptions
{
  uint32 tcaplus_size                    = 847900; // Tcaplus field size
  string tcaplus_desc                    = 847901; // Tcaplus description
  bool tcaplus_crypto                    = 847902; // Tcaplus crypto
}

extend google.protobuf.MessageOptions
{
  bool table = 60030;
  string node_type = 60031;
  TableStoreMode table_store_mode = 60032;
  // 联合索引，格式：idx_name(col1,col2)，用于 GORM 同 index 名多列与 tcaplus_index
  repeated string composite_index = 60033;
  // 物理表名覆盖，默认 message 名 snake_case
  string table_name = 60034;
  // 部分索引，格式：UNIQUE uq_name(col1,col2) WHERE scope='*' 或 INDEX idx_name(col1 DESC)
  repeated string partial_index = 60035;
  // 限定生成的 DB 驱动，如 "pgsql"。为空则生成全部（mysql/tcaplus/pgsql/redis/mongo）
  repeated string db_driver = 60036;
}

// Tags are applied at the field level
extend google.protobuf.FieldOptions {
  // Multiple Tags can be specified.
  string tags = 847939;
  bool primary_key = 847940; // Marks this field as a primary key
  bool skip_set_default = 847941; // ignore default value assignment for this field
  bool index = 847942; // Marks this field as index
  bool sharding_key = 847943; // Marks this field as tcaplus sharding key
  // 外键，格式：ref_table(ref_col) ON DELETE CASCADE
  string foreign_key = 847944;
}

extend google.protobuf.OneofOptions {
  // Multiple Tags can be specified.
  string oneof_tags = 847939;
}
